<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create Account | RojgarDwaar</title><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/auth.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./js/supabase-config.js"></script><script src="./js/auth.js" defer></script></head><body><header class="site-header"><div class="container header-inner"><a href="./index.html" class="logo">ROJGARDWAAR<span>.IN</span></a></div></header><main class="auth-page"><section class="auth-card"><h1>Create Account</h1><p class="auth-sub">Create your RojgarDwaar account to purchase and access test series.</p><div id="authMsg" class="auth-msg info" hidden></div><form id="registerForm" class="auth-form" onsubmit="registerUser(event)"><div><label for="name">Name</label><input id="name" type="text" required autocomplete="name"></div><div><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div><div><label for="password">Password</label><input id="password" type="password" minlength="8" required autocomplete="new-password"></div><button class="auth-btn" type="submit">Create Account</button></form><div id="otpBox" class="otp-box" hidden><h2>Verify your email</h2><p class="auth-sub">Enter the 6-digit OTP sent to your email address.</p><form class="auth-form" onsubmit="verifySignupOtp(event)"><div><label for="otp">6-digit OTP</label><input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required></div><button class="auth-btn" type="submit">Verify Email</button></form><button class="auth-secondary" type="button" onclick="resendSignupOtp()">Resend OTP</button></div><p class="auth-link">Already have an account? <a href="./login.html">Login</a></p></section></main></body></html>
