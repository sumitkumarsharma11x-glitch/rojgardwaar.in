<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login | RojgarDwaar</title><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/auth.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./js/supabase-config.js"></script><script src="./js/auth.js" defer></script></head><body><header class="site-header"><div class="container header-inner"><a href="./index.html" class="logo">ROJGARDWAAR<span>.IN</span></a></div></header><main class="auth-page"><section class="auth-card"><h1>Login</h1><p class="auth-sub">Login to access your RojgarDwaar courses and test history.</p><div id="authMsg" class="auth-msg info" hidden></div><form class="auth-form" onsubmit="loginUser(event)"><div><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div><div><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="auth-btn" type="submit">Login</button></form><p class="auth-link">New user? <a href="./register.html">Create an account</a></p></section></main></body></html>
