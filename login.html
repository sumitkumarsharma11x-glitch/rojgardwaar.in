<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login | RojgarDwaar</title>
<link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/auth.css?v=20261003premium">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabase-config.js"></script><script src="./js/auth.js" defer></script>
</head>
<body>
<header class="site-header"><div class="container header-inner"><a href="./index.html" class="logo">ROJGARDWAAR<span>.IN</span></a></div></header>
<main class="auth-page auth-register-page">
<section class="auth-card premium-auth-card">
<div class="auth-brand-mark" aria-hidden="true">RD</div>
<div class="premium-badge"><span>✦</span> PREMIUM LEARNING ACCESS</div>
<h1>Welcome back</h1>
<p class="auth-sub">Sign in to continue your RojgarDwaar preparation and access your premium test series.</p>
<div class="auth-benefits">
<div><strong>✓</strong><span>Premium test series</span></div><div><strong>✓</strong><span>Performance insights</span></div><div><strong>✓</strong><span>Secure progress</span></div>
</div>
<div id="authMsg" class="auth-msg info" hidden></div>
<form class="auth-form" onsubmit="loginUser(event)">
<div class="auth-field"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" required autocomplete="email"></div>
<div class="auth-field"><label for="password">Password</label><input id="password" type="password" placeholder="Enter your password" required autocomplete="current-password"></div>
<button class="auth-btn premium-btn" type="submit"><span>Sign in securely</span><b>→</b></button>
</form>
<p class="auth-link">New to RojgarDwaar? <a href="./register.html">Create your account</a></p>
<p class="auth-trust">🔒 Secure sign-in powered by RojgarDwaar</p>
</section>
</main>
</body></html>
